# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv:
  - ".env"


vars:
  EXTRAS_FLAG: '{{if .ARCH}}--extra {{.ARCH}}{{end}}'

tasks:
  default:
    desc: Default task - runs the app
    deps: [run]

  venv:
    desc: Set up virtual environment
    status:
      - test -d .venv
    cmds:
      - UV_TORCH_BACKEND=auto uv sync --frozen {{.EXTRAS_FLAG}}

  build:
    desc: Build the project
    deps: [venv]
    status:
      - test -f .build
      - test resources/paprika/export.paprikarecipes -ot .build
    cmds:
      - uv run -m src.cmd.paprika_etl
      - touch .build

  run:
    desc: Run the application
    deps: [build]
    cmds:
      - uv run -m src.cmd.start_app

  clean:
    desc: Clean build artifacts and virtual environment
    cmds:
      - rm -rf .venv
      - rm -rf resources/chroma
      - rm -f resources/paprika/.*.json

  lint:
    desc: Run linting checks
    deps: [venv]
    cmds:
      - uv run ruff check
      - uv run mypy --cache-fine-grained src

  lint-ci:
    desc: Run linting checks for CI
    deps: [venv]
    cmds:
      - uv run ruff check
      - uv run mypy src

  lint-fix:
    desc: Fix linting issues and format code
    deps: [venv]
    cmds:
      - uv run ruff check --fix
      - uv run ruff format
      - task: lint

  test:
    desc: Run tests
    deps: [venv]
    env:
      LANGSMITH_TRACING: 'false'
    cmds:
      - uv run pytest -r .
